name: Build Bypass Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, bypass-studio]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Verify bundled fonts
        run: |
          test -f app/src/main/res/font/noto_sans_bengali.ttf
          test -f app/src/main/res/font/inter.ttf
          test -f app/src/main/res/font/jetbrains_mono.ttf
          ls -lh app/src/main/res/font

      - name: Run JVM unit tests
        run: gradle testReleaseUnitTest --stacktrace --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify release output
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk || test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bypass-studio-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
